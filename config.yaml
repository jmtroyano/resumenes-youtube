# ============================================================
#  CONFIGURACIÓN DEL AGENTE DE RESÚMENES DE YOUTUBE
#  Se puede editar desde la app web (recomendado) o a mano.
#
#  Canales:
#   - activo: true  -> se resume automáticamente cada 3 horas (GitHub)
#   - activo: false -> en pausa: solo se usa bajo demanda desde la app
#   - channel_id    -> ID "UC..." del canal (la app lo rellena sola)
#   - max_por_revision -> límite de vídeos nuevos por revisión
# ============================================================

# Proveedor de IA para resúmenes y análisis (por ahora: gemini)
proveedor_ia: gemini
# Modelo de Gemini. Si Google lo retira, pon el 'flash' más reciente
modelo: gemini-3.8-flash
# Idioma de todos los resúmenes y análisis
idioma_resumen: español
# Vídeos resumidos como máximo en cada ejecución automática
max_videos_por_ejecucion: 4
# Vídeos que se cogen al activar un canal por primera vez
videos_iniciales_por_canal: 1
# Días que un vídeo puede esperar en cola antes de descartarse
dias_maximos_en_cola: 21
# Intentos antes de dar un vídeo por imposible
max_intentos: 3
# Ignorar los Shorts de YouTube
saltar_shorts: true
# Fotogramas por segundo que mira Gemini cuando resume desde el vídeo
fps_video: 0.1

