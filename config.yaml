# ============================================================
#  CONFIGURACIÓN DEL AGENTE DE RESÚMENES DE YOUTUBE
#  Puedes editar este archivo directamente desde la web de GitHub.
# ============================================================

# Modelo de Gemini. "gemini-2.5-flash" es rápido y entra en el plan gratuito.
# Si Google lo retira, cámbialo por el modelo "flash" más reciente que aparezca
# en https://ai.google.dev/gemini-api/docs/models
modelo: gemini-2.5-flash

# Idioma en el que quieres TODOS los resúmenes (aunque el vídeo esté en inglés).
idioma_resumen: español

# Cuántos vídeos se resumen como máximo en cada ejecución (hay una ejecución
# cada 3 horas). Los que no quepan esperan en cola a la siguiente.
max_videos_por_ejecucion: 4

# La primera vez que se añade un canal, cuántos de sus últimos vídeos se
# resumen (para no tragarse todo su historial de golpe).
videos_iniciales_por_canal: 1

# Si un vídeo lleva más de estos días esperando en la cola, se descarta.
dias_maximos_en_cola: 21

# Intentos antes de dar un vídeo por imposible (directos programados, vídeos
# privados, etc.).
max_intentos: 3

# Ignorar los Shorts de YouTube.
saltar_shorts: true

# Fotogramas por segundo que Gemini mira del vídeo. Para tertulias y análisis
# lo importante es el audio, así que un valor bajo ahorra mucho cupo.
fps_video: 0.1

# ------------------------------------------------------------
#  CANALES
#  - handle: el @nombre del canal (aparece en su URL: youtube.com/@xxxx)
#  - channel_id (opcional): si el handle falla, pon aquí el ID "UC..." y se
#    usará ese. La ejecución "comprobar_canales" te dice cuáles fallan.
#  - max_por_revision (opcional): para canales que suben muchísimos vídeos al
#    día (medios), cuántos vídeos nuevos se cogen como máximo en cada revisión.
#  - activo: false  -> desactiva el canal sin borrarlo.
# ------------------------------------------------------------
